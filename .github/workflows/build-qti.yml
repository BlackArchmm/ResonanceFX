name: Build QTI module

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
      - name: Build engine and module
        run: |
          ANDROID_SDK="$ANDROID_HOME" bash scripts/build-engine.sh
          bash scripts/build-module.sh
      - name: Check AIDL engine
        run: |
          so="$(ls out/engine/arm64-v8a/libresonancefx_aidl*.so)"
          echo "$so"
          "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d $so | grep NEEDED
          if "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d $so | grep -q 'libc++_shared'; then
            echo "::error::libc++_shared.so is still NEEDED"; exit 1
          fi
          unzip -l out/ResonanceFX-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ResonanceFX-qti
          path: |
            out/ResonanceFX-*.zip
            out/engine/arm64-v8a/libresonancefx_aidl*.so
